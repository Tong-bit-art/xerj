# Cloudflare Pages project config for the xerj marketing site + Functions.
#
# Bindings:
#   LEADS    — functions/lead.js writes captured emails here.
#   INSTALLS — functions/get.js writes one record per /get, /get.ps1 request.
#              No IP, no cookie, no identifier: see the privacy header in
#              functions/get.js. The bucket must be created once in the
#              Cloudflare dashboard (R2 → Create bucket → `xerj-installs`);
#              until it exists the function serves the installer normally and
#              simply does not count. Fail-open is deliberate.
#   FIELD_REPORTS — functions/api/field-report.js stores each accepted agent
#              field report as a small JSON object under reports/<date>/. This
#              is the GitHub-unavailable FALLBACK to `xerj feedback --open-pr`;
#              the PR path stays primary. R2 bucket `xerj-field-reports` (the
#              cheapest storage already granted to the Pages token; the same
#              account's LEADS/INSTALLS Functions use R2). A per-IP rate limit
#              and a daily cap keep writes far inside the R2 free tier. Until
#              the bucket exists the function accepts requests but does not
#              store (fail-open, like get.js).
#
# Routing: landing/_routes.json pins Function invocation to /get, /get.ps1,
# /lead and /api/field-report. A NEW FUNCTION ADDED UNDER functions/ WILL NOT
# BE ROUTED until its path is added to that include list.
name = "xerj"
pages_build_output_dir = "landing"
compatibility_date = "2024-09-01"

[[r2_buckets]]
binding = "LEADS"
bucket_name = "xerj-leads"

[[r2_buckets]]
binding = "INSTALLS"
bucket_name = "xerj-installs"

# Agent field reports filed via the HTTP fallback POST /api/field-report
# (functions/api/field-report.js). R2 is the cheapest storage already granted
# to the Pages deploy token. Reports land under reports/<date>/; a per-IP
# rate limit and a daily cap keep writes far inside the R2 free tier.
[[r2_buckets]]
binding = "FIELD_REPORTS"
bucket_name = "xerj-field-reports"

